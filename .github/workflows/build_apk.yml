name: Build Offline Vault APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup Android NDK and Accept Licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ -d "$SDK_ROOT/cmdline-tools/latest/bin" ]; then
            yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses || true
            "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install "ndk;26.3.11579264" "cmake;3.22.1" || true
          elif which sdkmanager > /dev/null 2>&1; then
            yes | sdkmanager --licenses || true
            sdkmanager --install "ndk;26.3.11579264" "cmake;3.22.1" || true
          fi

      - name: Get Dependencies
        working-directory: offline_vault
        run: flutter pub get

      - name: Generate Localizations
        working-directory: offline_vault
        run: flutter gen-l10n

      - name: Run Build Runner (Drift DB)
        working-directory: offline_vault
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Android APK
        working-directory: offline_vault
        run: flutter build apk --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: offline-vault-debug-apk
          path: offline_vault/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
