name: Build Offline Vault APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Android NDK (r26d)
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          link-to-sdk: true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        working-directory: offline_vault
        run: flutter pub get

      - name: Generate Localizations
        working-directory: offline_vault
        run: flutter gen-l10n

      - name: Run Build Runner (Drift DB)
        working-directory: offline_vault
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Android APK
        working-directory: offline_vault
        run: flutter build apk --debug -v

      - name: Upload APK Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-vault-debug-apk
          path: offline_vault/build/app/outputs/flutter-apk/*.apk
          retention-days: 14

      - name: Upload Build Reports & Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-failure-reports
          path: |
            offline_vault/build/app/reports/
            offline_vault/build/app/outputs/logs/
