name: Build Offline Vault APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Pre-accept Android SDK Licenses
        run: |
          SDK_DIR="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          mkdir -p "$SDK_DIR/licenses"
          printf "24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n84831b9409646a918e30573bab4c9c91346d8abd\n" > "$SDK_DIR/licenses/android-sdk-license"
          printf "84831b9409646a918e30573bab4c9c91346d8abd\n" > "$SDK_DIR/licenses/android-sdk-preview-license"

      - name: Get Dependencies
        working-directory: offline_vault
        run: flutter pub get

      - name: Generate Localizations
        working-directory: offline_vault
        run: flutter gen-l10n

      - name: Run Build Runner (Drift DB)
        working-directory: offline_vault
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Android APK
        working-directory: offline_vault
        run: flutter build apk --debug --android-skip-build-dependency-validation

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: offline-vault-debug-apk
          path: offline_vault/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
