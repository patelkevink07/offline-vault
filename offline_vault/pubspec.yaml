name: offline_vault
description: "Offline Vault - Android app for secure offline-first sharing of images and documents."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.0

  # Local Database
  drift: ^2.18.0
  drift_flutter: ^0.1.0
  sqlite3_flutter_libs: ^0.5.24

  # File system & Paths
  path_provider: ^2.1.3
  path: ^1.9.0
  mime: ^2.1.0
  uuid: ^4.6.0
  crypto: ^3.0.8

  # Encryption & Security
  cryptography: ^2.7.0
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.2.0

  # Backend & Auth
  supabase_flutter: ^2.5.6
  google_sign_in: ^6.2.1

  # Background work & Network
  connectivity_plus: ^6.0.3
  dio: ^5.4.3+1

  # Images & PDF
  image_picker: ^1.1.2
  file_picker: ^8.0.5
  flutter_image_compress: ^2.3.0
  photo_view: ^0.14.0
  pdfx: ^2.6.0

  # UI, Icons, Typography & QR
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.1.1
  shared_preferences: ^2.2.3

  # Crash Reporting
  sentry_flutter: ^8.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.18.0
  build_runner: ^2.4.9
  mocktail: ^1.0.3

flutter:
  uses-material-design: true
  generate: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: NotoSansGujarati
      fonts:
        - asset: assets/fonts/NotoSansGujarati.ttf
    - family: NotoSansDevanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari.ttf
